[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# the PyPI name bili-cli is taken; the project and the `bili` command keep their names
name = "bili-agent"
dynamic = ["version"]
description = "Bilibili command-line tool designed for AI agents: JSON output, stable error codes, zero interaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # upstream was archived in 2026-07; pin the last release so nothing new can slip in under this name
    "bilibili-api-python==17.4.2",
    "typer>=0.12",
    "qrcode[pil]>=7.4",
    "httpx>=0.27",
    "curl_cffi>=0.7",
]
keywords = ["bilibili", "cli", "agent", "ai", "mcp", "agent-skills"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "mcp>=2.3"]

[project.scripts]
bili = "bili_cli.main:main"

[tool.hatch.version]
path = "src/bili_cli/__init__.py"

[project.urls]
Homepage = "https://github.com/kukemc/bili-cli"
Issues = "https://github.com/kukemc/bili-cli/issues"
Changelog = "https://github.com/kukemc/bili-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_cli"]

[tool.hatch.build.targets.wheel.force-include]
# the Agent Skill lives at the repo root (for `npx skills add`) and ships inside the package
"skills/bili-cli" = "bili_cli/_skills/bili-cli"

[tool.hatch.build.targets.sdist]
exclude = ["assets/*.png", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
