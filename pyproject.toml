[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bili-cli"
version = "0.1.0"
description = "Bilibili command-line tool designed for AI agents: JSON output, stable error codes, zero interaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "bilibili-api-python>=17.4,<18",
    "typer>=0.12",
    "qrcode[pil]>=7.4",
    "httpx>=0.27",
    "curl_cffi>=0.7",
]
keywords = ["bilibili", "cli", "agent", "ai"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bili = "bili_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
