<!doctype html>
<!-- Source of assets/origin.png (1200x650). Render: shot.py assets/origin.html assets/origin.png 1200 650 2
     The fish is an original drawing, not any company's logo. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 650px; overflow: hidden; }
  body {
    font-family: "MiSans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(520px 380px at 0% 0%, rgba(255, 92, 147, 0.30), transparent 70%),
      radial-gradient(560px 420px at 100% 100%, rgba(34, 181, 245, 0.28), transparent 70%),
      #0D0F1C;
    color: #F4F5FA; display: flex; align-items: center; justify-content: center;
  }
  .window {
    width: 1040px; border-radius: 22px; overflow: hidden;
    background: rgba(19, 21, 35, 0.95); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .head { display: flex; align-items: center; gap: 14px; padding: 18px 24px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .head .avatar { width: 46px; height: 46px; }
  .head .who { font-size: 20px; font-weight: 600; }
  .head .status { font-size: 14px; color: #8FE3B0; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .head .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3DDC84; box-shadow: 0 0 8px #3DDC84; }
  .tv { margin-left: auto; font-size: 13px; color: #8B8FB0; font-family: "JetBrains Mono", monospace; }

  .chat { padding: 26px 34px 30px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .row.me { justify-content: flex-end; }
  .row .avatar { width: 52px; height: 52px; flex: 0 0 52px; }
  .bubble { max-width: 640px; padding: 14px 20px; border-radius: 20px; font-size: 22px; line-height: 1.55; }
  .fish .bubble { background: #252A42; border-bottom-left-radius: 6px; }
  .me .bubble { background: linear-gradient(135deg, #FF5C93, #A46BFF); border-bottom-right-radius: 6px; }
  .me .avatar { border-radius: 50%; background: linear-gradient(135deg, #FFB86B, #FF7AA8); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #fff; }
  .card {
    display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 14px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); margin-top: 10px;
  }
  .card .thumb { width: 108px; height: 61px; border-radius: 8px; background: linear-gradient(135deg, #2B3255, #46305C); position: relative; }
  .card .thumb::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.75); font-size: 20px; }
  .card .meta { font-size: 15px; color: #C9CCE0; line-height: 1.5; }
  .card .meta b { color: #fff; font-size: 16px; }
  .card .meta span { color: #FF7AA8; }
  .typing { font-size: 15px; color: #8B8FB0; margin-left: 66px; margin-top: -6px; }

  .divider { display: flex; align-items: center; gap: 18px; margin: 14px 0 2px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); }
  .born { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
  .born svg { width: 40px; height: 40px; }
  .born em { font-style: normal; font-family: "JetBrains Mono", monospace; background: linear-gradient(90deg, #FF7AA8, #B98CFF 50%, #5CC8F5); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- an original chubby cartoon fish -->
    <symbol id="fish" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD3FF"/><stop offset="1" stop-color="#2F8DF2"/></linearGradient>
      </defs>
      <circle cx="60" cy="60" r="58" fill="#1C2340"/>
      <path d="M92 60 L114 42 Q108 60 114 78 Z" fill="#3A9BF5"/>
      <ellipse cx="56" cy="62" rx="40" ry="34" fill="url(#fb)"/>
      <ellipse cx="50" cy="76" rx="26" ry="14" fill="#BFEFFF" opacity=".55"/>
      <path d="M50 30 Q62 18 74 30" fill="#3A9BF5"/>
      <circle cx="40" cy="56" r="9" fill="#0E1328"/><circle cx="37" cy="53" r="3.4" fill="#fff"/>
      <circle cx="64" cy="56" r="9" fill="#0E1328"/><circle cx="61" cy="53" r="3.4" fill="#fff"/>
      <ellipse cx="32" cy="70" rx="6" ry="3.6" fill="#FF8FB4" opacity=".75"/>
      <ellipse cx="73" cy="70" rx="6" ry="3.6" fill="#FF8FB4" opacity=".75"/>
      <path d="M47 71 Q52 76 57 71" fill="none" stroke="#0E1328" stroke-width="3" stroke-linecap="round"/>
      <path d="M80 70 Q90 66 88 78 Q82 76 80 70 Z" fill="#3A9BF5"/>
    </symbol>
  </defs>
</svg>

<div class="window">
  <div class="head">
    <svg class="avatar"><use href="#fish"/></svg>
    <div>
      <div class="who">大肥鱼</div>
      <div class="status">正在刷 B 站…</div>
    </div>
    <div class="tv">深夜 01:47</div>
  </div>

  <div class="chat">
    <div class="row fish">
      <svg class="avatar"><use href="#fish"/></svg>
      <div>
        <div class="bubble">主人，我刚刷到你的 B 站主页……</div>
        <div class="card">
          <div class="thumb"></div>
          <div class="meta"><b>主人的个人空间</b><br>粉丝 <span>一大堆</span> · 播放 <span>好多好多</span></div>
        </div>
      </div>
    </div>
    <div class="row fish">
      <svg class="avatar"><use href="#fish"/></svg>
      <div class="bubble">你的粉丝和播放量好多呀。<br>要是我也能像你一样，成为一名 UP 主就好了 🥺</div>
    </div>
    <div class="row me">
      <div class="bubble">……那我给你造一个吧。</div>
      <div class="avatar">主</div>
    </div>

    <div class="divider">
      <div class="born">
        <svg viewBox="0 0 512 512"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5C93"/><stop offset=".5" stop-color="#A46BFF"/><stop offset="1" stop-color="#22B5F5"/></linearGradient><linearGradient id="pr2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7AA8"/><stop offset="1" stop-color="#5CC8F5"/></linearGradient></defs><rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg2)"/><rect x="84" y="138" width="344" height="252" rx="56" fill="#15182A"/><rect x="84" y="138" width="344" height="252" rx="56" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="12"/><path d="M150 218 L210 264 L150 310" fill="none" stroke="url(#pr2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><rect x="236" y="296" width="96" height="26" rx="13" fill="url(#pr2)"/><path d="M400 70 C404 104 414 114 448 118 C414 122 404 132 400 166 C396 132 386 122 352 118 C386 114 396 104 400 70 Z" fill="#fff"/></svg>
        于是，<em>bili-cli</em> 诞生了
      </div>
    </div>
  </div>
</div>
</body>
</html>
